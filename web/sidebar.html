<button id="minitools-toggle-btn">
    <span class="drag-handle-icon">⠿</span>
    <span class="icon">MiniTools</span>
</button>

<div id="info-popover" class="info-popover"></div>
<div id="classify-recommendations" class="classify-recommendations"></div>

<div id="minitools-sidebar" class="minitools-hidden">
    <div class="minitools-header" id="sidebar-drag-handle">
        <button id="minitools-close-btn">×</button>
    </div>
    <div id="minitools-content">

        <div class="collapsible-section">
            <div class="section-header">
                <span class="arrow">▼</span>
                <span class="section-title">角色查询</span>
            </div>
            <div class="section-body">
                <div class="container">
                    <input type="text" id="search-src-input" class="input-box" autocomplete="off" placeholder="搜索源路径">
                    <button id="choose-src-btn" class="button">选择搜索源</button>
                    <button id="default-src-btn" class="button">默认搜索源</button>
                    <input type="file" id="hidden-file-input" accept=".xlsx, .xls, .csv" style="display: none;">
                </div>
                <div class="container">
                    <input type="text" id="character-search-input" class="input" placeholder="输入搜索关键词..." autocomplete="off">
                    <button id="character-search-btn" class="button">搜索</button>
                    <button id="moegirl-search-btn" class="button">百科</button>
                </div>
                <label class="search-progress" id="search-progress">输入关键词进行搜索</label>
                <div id="results-container" class="search-results-container">
                </div>
            </div>
        </div>

        <div class="collapsible-section">
            <div class="section-header">
                <span class="arrow">▼</span>
                <span class="section-title">模型下载</span>
            </div>
            <div class="section-body">
                <div class="container">
                    <input type="text" id="download-url" class="input-box" autocomplete="off" placeholder="请输入下载地址">
                </div>
                <div class="container">
                    <label for="preset-selections" id="preset-label">预设</label>
                    <select id="preset-selections" name="models" class="button">
                        <option value="civitai">Civitai</option>
                        <option value="default">默认</option>
                    </select>
                    <button id="download-btn" class="button">开始下载</button>
                    <button id="reload-btn" class="button">刷新</button>
                </div>
                <div style="display: flex; flex-direction: row; gap: 8px;">
                    <div style="display: flex; flex-direction: column;">
                        <label id="download-info-label">下载信息</label>
                        <div class="info-container" id="info-container">
                            <label class="title-text">文件名</label>
                            <label id="filename-label" class="main-text">-</label>
                            <label class="title-text">文件大小</label>
                            <label id="file-size-label" class="main-text">-</label>

                            <div id="civitai-info" style="display: flex; flex-direction: column;gap: 12px">
                                <label class="title-text">模型名称</label>
                                <label id="model-name-label" class="main-text">-</label>
                                <label class="title-text">模型版本</label>
                                <label id="model-version-label" class="main-text">-</label>
                                <label class="title-text">模型类型</label>
                                <label id="model-type-label" class="main-text">-</label>
                                <label class="title-text">基础模型</label>
                                <label id="base-model-label" class="main-text">-</label>
                            </div>
                        </div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <label class="title-text" id="api-key-label">API Key</label>
                        <div style="display: flex; flex-direction: row; gap: 5px;" id="api-container">
                            <input type="password" id="api-key-input" class="input-box" autocomplete="off" readonly>
                            <button class="button" id="api-key-edit-btn">编辑</button>
                        </div>
                        <label class="title-text">模型分类(保存路径)</label>
                        <div style="display: flex; flex-direction: row; gap: 5px; height: 25px;">
                            <button class="button" id="add-classify-btn">添加分类</button>
                            <button class="button" id="clear-classify-btn">清空</button>
                            <div style="display: flex; align-items: center;" id="autoClassifyContainer">
                                <input type="checkbox" id="autoClassifyInput" checked class="input-box" style="cursor: pointer">
                                <label for="autoClassifyInput" class="main-text" style="cursor: pointer">自动分类</label>
                            </div>
                        </div>
                        <div class="classify-container" id="classify-container">

                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <div class="minitools-footer">v1.0</div>
</div>
